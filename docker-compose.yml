services:
  mysql:
    image: mysql:8.0
    container_name: taskmanager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: taskdb        # creates the database automatically
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql   # keeps your data when the container stops

volumes:
  mysql-data: